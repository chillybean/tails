<div id="banner-container">
  <div id="tails-logo">
    [[
      <span>Tails</span>
      [[!img lib/logo.png link="no" class="svg" alt=""]]
    |index]]
  </div>
  <div id="search-and-donate">
    <nav aria-label="Search">
      <form method="get" action="https://duckduckgo.com/" id="searchform" target="_blank">
        <input type="search" id="searchbox" name="q" value="" size="16" placeholder="Using DuckDuckGo&hellip;" />
        <input type="hidden" name="sites" value="tails.net"/>
        <button aria-label="Search" type="submit"><span>Search</span></button>
      </form>
    </nav>
    <div id="donate">
      <a href="https://www.torproject.org/donate/donate-2025-banner-ts"><span>Donate</span></a>
    </div>
  </div>
</div>
<section id="yec-banner" data-bs-theme="dark" class="position-relative px-3 py-32 p-md-40 toggled toggle-d-block">
  <div class="d-flex container-fluid justify-content-center flex-md-row-reverse flex-wrap flex-md-nowrap gap-md-4 gap-lg-40">
    <div class="d-flex mb-3 mb-md-0">
      <img id="yec-illo" class="my-auto" src="lib/yec/globe-chain-burst.svg" role="img" alt="A wireframe globe breaking out of chains">
    </div>
    <div>
      <h1 class="mb-3 text-center text-md-start">
        Free the internet
      </h1>
      <p>
        Support tools that break the chains of censorship and surveillance. <span class="text-secondary fw-bold">Donate to the Tor Project today.</span>
      </p>
      <p>
        Through December 31, your gift will be matched, up to $250,000!
      </p><a class="btn btn-secondary px-3 py-13 mt-md-3 rounded-1 fs-tiny fw-bold w-100 w-md-auto" href="https://www.torproject.org/donate/donate-2025-banner-ts">Donate now<img src="lib/yec/heart.svg" alt="" role="img" class="align-text-bottom ms-2"></a>
    </div>
  </div><label tabindex="0" id="banner-close-label" for="banner-close" class="cursor-pointer position-absolute" data-controller="label" data-action="keydown-&gt;label#keydown"><button type="button" class="btn-close pe-active-none"></button></label>
</section>
