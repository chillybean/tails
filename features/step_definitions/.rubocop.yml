inherit_from: ../.rubocop.yml

Layout/LineLength:
  AllowedPatterns:
    # The first line of step definitions can be very long.
    - \A(Given|When|But|Then).*
    # Snapshot descriptions and parent_checkpoints can be very long.
    - \A\s+description:\s+
    - \A\s+parent_checkpoint:\s+

Lint/AmbiguousRegexpLiteral:
  Description: This makes defining steps less verbose.
  Enabled: false
