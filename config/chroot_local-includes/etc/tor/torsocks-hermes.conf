# torsocks configuration for Hermes/Ollama
# This ensures all network connections from these apps go through Tor

server = 127.0.0.1
server_type = 5
server_port = 9050

# Allow local connections (Ollama API on localhost)
local = 127.0.0.0/255.128.0.0
local = 127.128.0.0/255.192.0.0

# Local networks
local = 10.0.0.0/255.0.0.0
local = 172.16.0.0/255.240.0.0
local = 192.168.0.0/255.255.0.0
