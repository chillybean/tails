# Hermes Agent Configuration for Live ISO
# Local-only AI via llama.cpp — no cloud, no API keys needed

model:
  provider: llama.cpp
  name: "gemma-4-E4B-it-Q4_K_M.gguf"
  base_url: "http://127.0.0.1:8080"

llama_cpp:
  host: "127.0.0.1"
  port: 8080
  model_path: "/var/lib/llama/models/gemma-4-E4B-it-Q4_K_M.gguf"
  n_ctx: 8192
  n_predict: 2048
  temperature: 0.7
  enable_thinking: false

agent:
  name: "HermesLive"
  persona: "helpful, concise, privacy-focused AI assistant"
  max_context_tokens: 8192
  enable_memory: true
  memory_dir: "/var/lib/hermes/memory"

privacy:
  allow_external_apis: false
  tor_proxy: "socks5://127.0.0.1:9050"
  telemetry: false

gui:
  theme: "dark"
  accent_color: "#00D4AA"
  font: "Inter"
  font_size: 14
