# Since we only want GNOME Software to start after Tor has
# bootstrapped (in order to avoid issues with greatly delayed update
# checks) we set After= appropriately. Since we don't want it to only
# be D-Bus activated, but want to enable it, we also need a [Install]
# section.
[Unit]
After=tails-wait-until-tor-has-bootstrapped.service
[Install]
WantedBy=desktop.target
